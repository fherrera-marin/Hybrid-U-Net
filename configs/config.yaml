model:
  input_shape: [256, 512, 1]   # (H, W, channels) — 256x512 grid

training:
  epochs: 1000
  batch_size: 4              # reduced vs. the 80x200 grid due to higher resolution
  learning_rate: 0.001
  val_size:  0.15   # validation fraction (early stopping) — over the full dataset
  test_size: 0.15   # test hold-out fraction — never seen during training
  random_state: 42
  patience: 10               # EarlyStopping
  loss_alpha: 3.0            # Near-wall weight: higher -> more concentrated at the wall

evaluation:
  nearwall_cells: 2   # Threshold = nearwall_cells x grid spatial resolution (min. non-zero SDF)

paths:
  dataset:       "data/CNN_df.pkl"
  saved_model:   "saved_models/best_model_256x512.weights.h5"
  split_indices: "saved_models/split_indices_256x512.npz"
  norm_params:   "saved_models/norm_params_256x512.npz"
  results_dir:   "data/results"
